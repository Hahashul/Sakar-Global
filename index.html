<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0D0D0D;
      --surface: #161616;
      --accent: #6C63FF;
      --text: #F0EEE8;
      --muted: #5A5A5A;
      --border: rgba(255,255,255,0.07);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .grain {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    .glow {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(108,99,255,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 680px;
      width: 100%;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.2s;
    }

    .headline {
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 0;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.45s;
    }

    .typewriter-line {
      display: block;
      white-space: nowrap;
      overflow: hidden;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 0.85em;
      background: var(--accent);
      vertical-align: -0.05em;
      margin-left: 4px;
      animation: blink 1.1s step-end infinite;
      border-radius: 1px;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--accent);
      margin: 2.5rem auto;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.9s;
    }

    .tagline {
      font-size: 1rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.01em;
      line-height: 1.6;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 1.1s;
    }

    .footer {
      position: fixed;
      bottom: 2rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 2rem;
      z-index: 1;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 1.5s;
    }

    .dot-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
    }

    .dot.active {
      background: var(--accent);
      animation: pulse 2s ease infinite;
    }

    .footer-text {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; opacity: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <main class="content">
    <p class="eyebrow">Something is coming</p>

    <h1 class="headline">
      <span class="typewriter-line" id="typed-text"></span>
      <span class="cursor" aria-hidden="true"></span>
    </h1>

    <div class="divider"></div>

    <p class="tagline">We're working on something we're proud of.<br>Stay tuned.</p>
  </main>

  <footer class="footer">
    <div class="dot-row" aria-hidden="true">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <span class="footer-text">In progress</span>
  </footer>

  <script>
    const words = ['something\nnew.', 'something\nbold.', 'something\nreal.'];
    let wordIndex = 0;
    let charIndex = 0;
    let deleting = false;
    let lineEl = document.getElementById('typed-text');
    let started = false;

    function type() {
      const current = words[wordIndex];
      const display = current.replace('\n', '\n');
      const lines = current.split('\n');

      if (!deleting) {
        charIndex++;
        const raw = current.substring(0, charIndex);
        const parts = raw.split('\n');
        lineEl.innerHTML = parts.map((p, i) =>
          i < parts.length - 1 ? p + '<br>' : p
        ).join('');

        if (charIndex === current.length) {
          setTimeout(() => { deleting = true; type(); }, 2200);
          return;
        }
        setTimeout(type, 80);
      } else {
        charIndex--;
        const raw = current.substring(0, charIndex);
        const parts = raw.split('\n');
        lineEl.innerHTML = parts.map((p, i) =>
          i < parts.length - 1 ? p + '<br>' : p
        ).join('');

        if (charIndex === 0) {
          deleting = false;
          wordIndex = (wordIndex + 1) % words.length;
          setTimeout(type, 300);
          return;
        }
        setTimeout(type, 40);
      }
    }

    setTimeout(type, 900);
  </script>
</body>
</html>
